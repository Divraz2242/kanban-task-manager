    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="board">
            <div class="column" id="todo">
                <h2>To Do</h2>
                <div class="tasks" id ="todo-tasks"></div>
                <input type="text" class="task-input" id="todo-input" placeholder="Add a Task">
                 <button class="add class" onclick="addTask('todo')">Add task</button>
            </div>
            <div class="column" id="doing">
                <h2>Doing</h2>
                <div class="tasks" id ="doing-tasks"></div>
                <input type="text" class="task-input" id="doing-input" placeholder="Add a Task">
                 <button class="add-task" onclick="addTask('doing')">Add task</button>
            </div>    
            <div class="column" id="done">
                <h2>Done</h2>
                <div class="tasks" id ="done-tasks"></div>
                <input type="text" class="task-input" id="done-input" placeholder="Add a Task">
                 <button class="add-task" onclick="addTask('done')">Add task</button>
            </div>
        </div>
        <div class="context-menu">
            <ul>
                <li onclick="editElement()">Edit</li>
                <li onclick="deleteElement()">Delete</li>
            </ul>
        </div>
        <script src="./script.js"></script>
    </body>
    </html>
